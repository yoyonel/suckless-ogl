site_name: Suckless OGL
site_description: A lean, high-performance C11 PBR Renderer
site_author: Latty
repo_url: https://github.com/yoyonel/suckless-ogl
repo_name: yoyonel/suckless-ogl

# Exclude Doxygen-specific resources from MkDocs build
exclude_docs: |
  doxygen-awesome-css/**/*

# Configure validation to ignore generated links that aren't in source docs/
validation:
  nav:
    not_found: ignore
  links:
    unrecognized_links: ignore

hooks:
  - hooks/generate_diagram_index.py
  - hooks/render_graphviz.py

theme:
  name: material
  palette:
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

  features:
    # - navigation.tabs # Disabled for vertical sidebar
    # - navigation.sections # Keep sections if you want groups to expand
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - git-revision-date-localized:
      type: date
  - redirects:
      redirect_maps: {}
  - glightbox

extra_javascript:
  - assets/javascripts/mathjax.js
  - assets/javascripts/mermaid_config.js
  - https://unpkg.com/mermaid/dist/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/extra.css

