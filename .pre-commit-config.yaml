repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        args: [--unsafe]
    -   id: check-added-large-files
        args: [--maxkb=2000]

-   repo: local
    hooks:
    -   id: make-format
        name: make format
        description: Run 'make format' to auto-format C code using clang-format.
        entry: make format
        language: system
        files: \.(c|h|glsl|vert|frag)$
        pass_filenames: false
        stages: [pre-commit]

    -   id: check-nolint
        name: check-nolint
        description: Reject new NOLINT suppressions vs origin/master.
        entry: bash scripts/check_nolint.sh
        language: system
        files: \.(c|h)$
        pass_filenames: false
        stages: [pre-commit]

    -   id: make-format-check
        name: make format-check
        description: Verify formatting without modifying files (dry-run).
        entry: make format-check
        language: system
        files: \.(c|h|glsl|vert|frag|py)$
        pass_filenames: false
        stages: [pre-push]

    -   id: make-lint
        name: make lint
        description: Run 'make lint' to check code quality using clang-tidy via Makefile.
        entry: make lint
        language: system
        files: \.(c|h)$
        pass_filenames: false
        stages: [pre-push]
