  <script type="text/javascript">
    // Force dark mode before rendering to avoid flash if no preference exists
    if (localStorage.getItem("theme-mode") === null || localStorage.getItem("theme-mode") === "dark") {
      document.documentElement.classList.add("dark-mode");
    }

    window.addEventListener("DOMContentLoaded", (event) => {
      DoxygenAwesomeDarkModeToggle.init()
      DoxygenAwesomeFragmentCopyButton.init()
      DoxygenAwesomeParagraphLink.init()
      DoxygenAwesomeInteractiveToc.init()
      DoxygenAwesomeTabs.init()
      // 1. Highlighting Orchestrator (Aggressive)
      document.querySelectorAll('div.fragment, pre.fragment, pre.code, code').forEach((el) => {
        // Skip if it's an ASCII tree (heuristic)
        if (el.innerText.includes('├──') || el.innerText.includes('└──')) return;

        let text = el.innerText;
        let isDoxygenMess = false;

        // Detect literal markers (failed Doxygen/Markdown parsing)
        if (text.includes('\\code') || text.includes('```')) {
          isDoxygenMess = true;
          // Strip markers
          text = text.replace(/\\code\{[^}]*\}|\\endcode|```[a-z]*/g, '').trim();
        }

        // Special case: Doxygen failed parsing and outputs <code> inside a paragraph
        if (el.tagName === 'CODE' && (text.includes('\n') || text.startsWith('c '))) {
          isDoxygenMess = true;
          if (text.startsWith('c ')) text = text.substring(2);
        }

        if (isDoxygenMess) {
          const div = document.createElement('div');
          div.className = 'fragment';
          const pre = document.createElement('pre');
          pre.style.margin = '0';
          const code = document.createElement('code');
          code.textContent = text;
          pre.appendChild(code);
          div.appendChild(pre);
          el.parentNode.replaceChild(div, el);
          hljs.highlightElement(code);
          return;
        }

        // Handle Doxygen-Awesome's line structure
        if (el.querySelector('.line')) {
          if (el.querySelectorAll('span').length > 5) return;
          const rawText = Array.from(el.querySelectorAll('.line')).map(l => l.innerText).join('\n');
          el.innerHTML = '';
          const pre = document.createElement('pre');
          pre.style.margin = '0';
          pre.style.padding = '0';
          const code = document.createElement('code');
          code.textContent = rawText;
          pre.appendChild(code);
          el.appendChild(pre);
          hljs.highlightElement(code);
          return;
        }

        // Skip small inline code
        if (el.tagName === 'CODE' && text.length < 15) return;

        hljs.highlightElement(el);
      });

      // 2. Dynamic iframe height adjustment
      document.querySelectorAll('.dotgraph iframe').forEach((iframe) => {
        iframe.addEventListener('load', () => {
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            const svg = doc.querySelector('svg');
            if (svg) {
              const height = svg.getAttribute('height');
              if (height) {
                iframe.style.height = (parseInt(height) + 20) + 'px';
              }
            }
          } catch (e) { }
        });
      });
    });
  </script>
