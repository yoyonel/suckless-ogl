name: Suckless-OGL CI/CD

permissions:
  contents: write
  pages: write
  pull-requests: write
  id-token: write

on:
  workflow_dispatch: # Permet le lancement manuel via UI ou `gh workflow run`
  push:
    # On ne lance au push QUE sur master pour mettre à jour le site officiel et les releases
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
    # Pour tout le reste, on passe par les PRs (master/main comme cibles)
    # Cela garantit un seul run par commit dans une PR
    branches: ["master", "main"]
  schedule:
    # Build nightly tous les jours à 01h00 UTC
    - cron: '0 1 * * *'

jobs:
  # --- JOB 1 : QUALITÉ ET LINT (RAPIDE) ---
  lint-and-format:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository }}-ci:latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Clang-Tidy Results
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/cltcache
          key: ${{ runner.os }}-cltcache-${{ hashFiles('src/**/*.c', 'include/**/*.h', '.clang-tidy', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-cltcache-

      - name: Check for new NOLINT suppressions
        run: |
          git config --global --add safe.directory '*'
          BASE="origin/${{ github.base_ref || 'master' }}"
          make check-nolint CONTAINER_RUN="" NOLINT_BASE_REF="${BASE}"

      - name: Run Format & Lint
        run: |
          git config --global --add safe.directory '*'
          clang-format --version
          make format CONTAINER_RUN=""
          git diff --exit-code || (echo "❌ Format error" && exit 1)
          # Linting stays strict for code quality, but we pass flags if needed for build steps
          make lint CONTAINER_RUN=""
          make lint-full CONTAINER_RUN=""

  # --- JOB 2 : TESTS, COUVERTURE ET CAPTURES VISUELLES (LENT) ---
  test-and-coverage:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository }}-ci:latest
    env:
      EXTRA_CMAKE_FLAGS: ""
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make test wrapper executable
        run: |
          git config --global --add safe.directory '*'
          chmod +x .github/workflows/scripts/run_test_with_xvfb.sh

      - name: Run Python Tests
        run: make test-python

      - name: Run Coverage and Tests
        id: run_tests
        run: |
          # Exécution des tests via Xvfb avec suppression des warnings RAII
          xvfb-run -a -s "-screen 0 1920x1080x24" make coverage \
            CONTAINER_RUN="" \
            CC="clang" \
            CXX="clang++"


      - name: Generate Visual Artifacts
        if: always()
        run: |
          mkdir -p visual_artifacts/${{ github.sha }}
          mkdir -p build-coverage/coverage_report/visual_tests

          # Collect results for storage
          cp tests/references/ref_*.png visual_artifacts/${{ github.sha }}/ 2>/dev/null || true
          cp tests/references/failed_*.png visual_artifacts/${{ github.sha }}/ 2>/dev/null || true
          # We will also collect effect_diffs after the script runs

          # Run dynamic report generator (produces index.html and comment.md)
          python3 .github/workflows/scripts/generate_visual_report.py "${{ github.sha }}" "${{ github.repository }}" "${{ github.event.number }}"

          # Collect generated diffs as well
          cp build-coverage/coverage_report/visual_tests/effect_diff_*.png visual_artifacts/${{ github.sha }}/ 2>/dev/null || true

          # Copy images for the static coverage report site
          cp visual_artifacts/${{ github.sha }}/*.png build-coverage/coverage_report/visual_tests/ 2>/dev/null || true

      - name: Upload Images to Visual Storage Branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./visual_artifacts
          publish_branch: visual-artifacts
          keep_files: true

      - name: Post Visual Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        env:
          VISUAL_COMMENT: ${{ env.VISUAL_COMMENT }}
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-id: visual-regression
          message: ${{ env.VISUAL_COMMENT }}

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build-coverage/coverage_report/

  # --- NEW JOB : TESTS WINDOWS (WINE) ---
  test-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 wine64 xvfb
      - name: Build tests for Windows
        run: |
          git config --global --add safe.directory '*'
          cmake -B build-test-win -DCMAKE_TOOLCHAIN_FILE=toolchain-mingw.cmake -DBUILD_TESTS=ON -DENABLE_NATIVE_ARCH=OFF
          cmake --build build-test-win --parallel $(nproc)
      - name: Run Windows tests under Wine
        run: |
          export WINEPREFIX=$HOME/.wine
          export WINEDEBUG=-all
          cd build-test-win && ctest --output-on-failure


  # --- JOB 3 : DOCS, DIAGRAMMES ET QUALITÉ DOC ---
  documentation:
    needs: [test-and-coverage]
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository }}-ci:latest
    env:
      EXTRA_CMAKE_FLAGS: ""
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Generate and Verify Docs
        run: |
          git config --global --add safe.directory '*'
          make docs CONTAINER_RUN=""

      - name: Download Coverage for Preview
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: site/coverage

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-docs
          path: site/

      - name: Setup Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Deploy Documentation Preview (Pull Request)
        if: github.event_name == 'pull_request'
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "⚠️ SURGE_TOKEN est vide ou indisponible (PR provenant d'un fork potentiellement)."
            echo "⏭️ Déploiement du preview Surge ignoré pour ne pas briser le CI."
            echo "PREVIEW_URL=(Aperçu non disponible pour les forks)" >> $GITHUB_ENV
            exit 0
          fi
          PR_NUMBER=${{ github.event.number }}
          DEPLOY_DOMAIN="suckless-ogl-pr-$PR_NUMBER.surge.sh"
          npx surge site/ $DEPLOY_DOMAIN --token $SURGE_TOKEN
          echo "PREVIEW_URL=https://$DEPLOY_DOMAIN" >> $GITHUB_ENV

      - name: Comment Preview Link on PR
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message-id: docs-preview
          message: |
            ## ⚗️ Documentation Preview
            The Doxygen documentation for this PR has been generated and is ready for review:

            🔗 **[Preview Link](${{ env.PREVIEW_URL }})**

            *Last updated: ${{ github.event.pull_request.updated_at || 'Just now' }} (commit: ${{ github.sha }})*

  # --- JOB 4 : DÉPLOIEMENT UNIFIÉ VERS GITHUB PAGES ---
  deploy-pages:
    needs: [test-and-coverage, documentation]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 1. On récupère le site complet (MkDocs + Doxygen intégrés)
      - name: Download Documentation
        uses: actions/download-artifact@v8
        with:
          name: doxygen-docs
          path: public-site

      # 2. On ajoute le rapport de couverture dans un sous-dossier
      - name: Download Coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: public-site/coverage

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-site
          keep_files: false
          destination_dir: .

  # --- JOB 3 : BUILDS DE PRODUCTION ---
  build-production:
    needs: [lint-and-format, test-and-coverage]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository }}-ci:latest
    strategy:
      matrix:
        build_type: [Release, Profiling, UltraRelease]
    env:
      EXTRA_CMAKE_FLAGS: ""
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          git config --global --add safe.directory '*'
          FLAGS=""
          BTYPE=${{ matrix.build_type }}
          if [ "$BTYPE" == "UltraRelease" ]; then
            BTYPE="Release"
            FLAGS="-DENABLE_UNITY_BUILD=ON -DENABLE_NATIVE_ARCH=ON -DENABLE_AGGRESSIVE_MATH=ON"
          fi
          cmake $EXTRA_CMAKE_FLAGS -B build -DCMAKE_BUILD_TYPE=$BTYPE $FLAGS
          cmake --build build --parallel $(nproc)
          mv build/app build/app-${{ matrix.build_type }}
      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.build_type }}
          path: build/app-${{ matrix.build_type }}

  # --- JOB 4 : BUILD DE PRODUCTION WINDOWS ---
  build-production-windows:
    needs: [lint-and-format, test-windows]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install MinGW and Dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Build Windows Release
        run: |
          git config --global --add safe.directory '*'
          # Install rust just tool
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          # Run the cross-compilation target specifying UltraRelease/Release
          # 'just build-win' uses the default Profile=Debug. Let's explicitly invoke cmake
          # with UltraRelease for the final artifact using the toolchain.
          cmake -B build-win -DCMAKE_TOOLCHAIN_FILE=toolchain-mingw.cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_NATIVE_ARCH=ON
          cmake --build build-win --parallel $(nproc)
          mv build-win/app.exe build-win/app-Windows-Release.exe
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v7
        with:
          name: app-Windows-Release
          path: build-win/app-Windows-Release.exe

  # --- JOB 5 : RELEASE ---
  release:
    needs: [build-production, build-production-windows, test-windows]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Nécessaire pour les tags

      - uses: actions/download-artifact@v8
        with: { path: artifacts }

      - name: Update Nightly Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Supprimer l'ancienne release nightly (assets + release, sans toucher le tag)
          gh release delete nightly -y || true
          # Recréer le tag sur le commit actuel
          git tag -f nightly
          git push origin nightly --force

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'nightly' || github.ref_name }}
          name: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'Nightly Build' || github.ref_name }}
          prerelease: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
          draft: false
          files: artifacts/app-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
