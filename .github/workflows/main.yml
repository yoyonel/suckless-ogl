name: Suckless-OGL CI/CD

permissions:
  contents: write
  pages: write
  pull-requests: write
  id-token: write

on:
  push:
    # On ne lance au push QUE sur master pour mettre à jour le site officiel et les releases
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
    # Pour tout le reste, on passe par les PRs (master/main comme cibles)
    # Cela garantit un seul run par commit dans une PR
    branches: ["master", "main"]
  schedule:
    # Build nightly tous les jours à 01h00 UTC
    - cron: '0 1 * * *'

jobs:
  # --- JOB 1 : QUALITÉ ET LINT (RAPIDE) ---
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install linting tools via pip
        run: |
          pip install clang-format==19.1.7 ruff cltcache
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Clang-Tidy Results
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cltcache
          key: ${{ runner.os }}-cltcache-${{ hashFiles('src/**/*.c', 'include/**/*.h', '.clang-tidy', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-cltcache-

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglew-dev libglfw3-dev cmake clang-tidy gamemode-dev libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Run Format & Lint
        run: |
          clang-format --version
          make format CONTAINER_RUN=""
          git diff --exit-code || (echo "❌ Format error" && exit 1)
          make lint CONTAINER_RUN=""

  # --- JOB 2 : TESTS, COUVERTURE ET CAPTURES VISUELLES (LENT) ---
  test-and-coverage:
    needs: lint-and-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang llvm \
            libgl1-mesa-dev libglew-dev libglfw3-dev \
            xorg-dev xvfb libgl1-mesa-dri mesa-vulkan-drivers \
            imagemagick gamemode-dev libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev

      - name: Make test wrapper executable
        run: chmod +x .github/workflows/scripts/run_test_with_xvfb.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python tools
        run: pip install ruff pytest pytest-cov

      - name: Run Python Tests
        run: make test-python

      - name: Run Coverage and Tests
        id: run_tests
        run: |
          # Exécution des tests via Xvfb
          xvfb-run -a -s "-screen 0 1920x1080x24" make coverage CONTAINER_RUN="" CC=clang


      - name: Generate Visual Artifacts
        if: always()
        run: |
          mkdir -p visual_artifacts/${{ github.sha }}
          mkdir -p build-coverage/coverage_report/visual_tests

          # Collect results for storage
          cp tests/ref_*.png visual_artifacts/${{ github.sha }}/ 2>/dev/null || true
          cp tests/failed_*.png visual_artifacts/${{ github.sha }}/ 2>/dev/null || true

          # Run dynamic report generator (produces index.html and comment.md)
          python3 .github/workflows/scripts/generate_visual_report.py "${{ github.sha }}" "${{ github.repository }}"

          # Copy images for the static coverage report site
          cp visual_artifacts/${{ github.sha }}/*.png build-coverage/coverage_report/visual_tests/ 2>/dev/null || true

      - name: Upload Images to Visual Storage Branch
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./visual_artifacts
          publish_branch: visual-artifacts
          keep_files: true

      - name: Post Visual Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        env:
          VISUAL_COMMENT: ${{ env.VISUAL_COMMENT }}
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-id: visual-regression
          message: ${{ env.VISUAL_COMMENT }}

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-coverage/coverage_report/


  # --- JOB 3 : DOCS, DIAGRAMMES ET QUALITÉ DOC ---
  documentation:
    needs: lint-and-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Documentation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Python Dependencies
        run: pip install -r requirements-dev.txt
      - name: Generate and Verify Docs
        run: make docs CONTAINER_RUN=""
      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-docs
          path: site/

      - name: Deploy Documentation Preview (Pull Request)
        if: github.event_name == 'pull_request'
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.number }}
          DEPLOY_DOMAIN="suckless-ogl-pr-$PR_NUMBER.surge.sh"
          npx surge site/ $DEPLOY_DOMAIN --token $SURGE_TOKEN
          echo "PREVIEW_URL=https://$DEPLOY_DOMAIN" >> $GITHUB_ENV

      - name: Comment Preview Link on PR
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message-id: docs-preview
          message: |
            ## ⚗️ Documentation Preview
            The Doxygen documentation for this PR has been generated and is ready for review:

            🔗 **[Preview Link](${{ env.PREVIEW_URL }})**

            *Last updated: ${{ github.event.pull_request.updated_at || 'Just now' }} (commit: ${{ github.sha }})*

  # --- JOB 4 : DÉPLOIEMENT UNIFIÉ VERS GITHUB PAGES ---
  deploy-pages:
    needs: [test-and-coverage, documentation]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. On récupère le site complet (MkDocs + Doxygen intégrés)
      # L'artefact 'doxygen-docs' contient désormais le dossier 'site/' complet
      - name: Download Documentation
        uses: actions/download-artifact@v4
        with:
          name: doxygen-docs
          path: public-site

      # 2. On ajoute le rapport de couverture dans un sous-dossier
      - name: Download Coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: public-site/coverage

      # 3. Plus besoin de landing page manuelle, MkDocs s'en charge (index.html à la racine)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-site
          keep_files: false
          destination_dir: .

  # --- JOB 3 : BUILDS DE PRODUCTION ---
  build-production:
    needs: test-and-coverage
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Profiling, UltraRelease]
    steps:
      - uses: actions/checkout@v4
      - name: Install Deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libgl1-mesa-dev libglew-dev libglfw3-dev gamemode-dev libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Build
        run: |
          FLAGS=""
          BTYPE=${{ matrix.build_type }}
          if [ "$BTYPE" == "UltraRelease" ]; then
            BTYPE="Release"
            FLAGS="-DENABLE_UNITY_BUILD=ON -DENABLE_NATIVE_ARCH=ON -DENABLE_AGGRESSIVE_MATH=ON"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=$BTYPE $FLAGS
          cmake --build build --parallel $(nproc)
          mv build/app build/app-${{ matrix.build_type }}
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.build_type }}
          path: build/app-${{ matrix.build_type }}

  # --- JOB 5 : RELEASE ---
  release:
    needs: build-production
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour les tags

      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Update Nightly Tag
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # On supprime le tag localment et on le recrée sur le commit actuel
          git tag -f nightly
          git push origin nightly --force

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'nightly' || github.ref_name }}
          name: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'Nightly Build' || github.ref_name }}
          prerelease: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
          draft: false
          files: artifacts/app-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
